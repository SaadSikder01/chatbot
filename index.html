<!DOCTYPE html>
<html>
<head>
  <title>Study Chatbot</title>
</head>
<body>

<h2>📚 Study Chatbot</h2>

<input id="input" placeholder="প্রশ্ন লিখো..." style="width:300px;">
<button onclick="ask()">Ask</button>

<p id="output"></p>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.5.0";

let generator;
let isReady = false;

async function loadModel() {
    document.getElementById("output").innerText = "⏳ AI লোড হচ্ছে...";
    try {
        generator = await pipeline("text2text-generation", "Xenova/flan-t5-small");
        isReady = true;
        document.getElementById("output").innerText = "✅ AI Ready!";
    } catch (e) {
        document.getElementById("output").innerText = "❌ Model load error!";
        console.error(e);
    }
}

loadModel();

window.ask = async function() {
    const text = document.getElementById("input").value;

    if (!isReady) {
        document.getElementById("output").innerText = "⏳ একটু অপেক্ষা করো, AI এখনো load হচ্ছে...";
        return;
    }

    if (!text) return;

    document.getElementById("output").innerText = "🤔 ভাবছে...";

    try {
        const result = await generator("Explain simply in Bangla: " + text);

        if (result && result[0] && result[0].generated_text) {
            document.getElementById("output").innerText = result[0].generated_text;
        } else {
            document.getElementById("output").innerText = "❌ উত্তর পাওয়া যায়নি!";
            console.log(result);
        }

    } catch (error) {
        document.getElementById("output").innerText = "❌ Error: " + error.message;
        console.error(error);
    }
}
</script>

</body>
</html>
