<!DOCTYPE html>
<html>
<head>
  <title>Study Chatbot</title>
</head>
<body>

<h2>📚 Study Chatbot</h2>

<input id="input" placeholder="প্রশ্ন লিখো..." style="width:300px;">
<button onclick="ask()">Ask</button>

<p id="output"></p>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.5.0";

let generator;

async function loadModel() {
    document.getElementById("output").innerText = "Loading AI model...";
    generator = await pipeline("text2text-generation", "Xenova/flan-t5-small");
    document.getElementById("output").innerText = "AI Ready!";
}

loadModel();

window.ask = async function() {
    const text = document.getElementById("input").value;

    document.getElementById("output").innerText = "Thinking...";

    const result = await generator("Explain simply: " + text);

    document.getElementById("output").innerText = result[0].generated_text;
}
</script>

</body>
</html>
